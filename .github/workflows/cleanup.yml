# Registry retention for ghcr.io/crowdprobe/agentbox. GHCR never expires
# anything on its own.
#
# AGE-based, not count-based: a dated build (:<tier>-YYYYMMDD[-HHmmss]) is
# only a deletion candidate once it is older than 90 days, regardless of how
# many builds have piled up since. The moving :<tier> tags are excluded
# outright and are never a candidate. Untagged versions (superseded builds)
# and any signature/attestation/SBOM attached to one get the same 90-day
# floor, so a build superseded minutes ago is not swept the same day.
#
# Needs: this repository has the Admin role on the package
# (Package settings -> Manage Actions access).
name: cleanup

on:
  schedule:
    - cron: "0 4 * * 0"   # Sundays, between Renovate (03:00) and the build (05:00)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report what would be deleted"
        type: boolean
        default: true

permissions: {}

# The action is not safe to run concurrently against the same package, and a
# build pushing while it runs could race with untagged-version deletion.
concurrency:
  group: build-refs/heads/main
  cancel-in-progress: false

jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      # Scheduled runs delete for real; manual runs default to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
    steps:
      - name: core - dated builds older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: agentbox
          delete-tags: 'core-2*'   # dated builds only: core-YYYYMMDD[-HHmmss]
          exclude-tags: 'core,cad,ml,infra'
          older-than: 90 days
          dry-run: ${{ env.DRY_RUN }}

      - name: cad - dated builds older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: agentbox
          delete-tags: 'cad-2*'   # dated builds only: cad-YYYYMMDD[-HHmmss]
          exclude-tags: 'core,cad,ml,infra'
          older-than: 90 days
          dry-run: ${{ env.DRY_RUN }}

      - name: ml - dated builds older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: agentbox
          delete-tags: 'ml-2*'   # dated builds only: ml-YYYYMMDD[-HHmmss]
          exclude-tags: 'core,cad,ml,infra'
          older-than: 90 days
          dry-run: ${{ env.DRY_RUN }}

      - name: infra - dated builds older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: agentbox
          delete-tags: 'infra-2*'   # dated builds only: infra-YYYYMMDD[-HHmmss]
          exclude-tags: 'core,cad,ml,infra'
          older-than: 90 days
          dry-run: ${{ env.DRY_RUN }}

      - name: untagged + orphaned signatures/attestations older than 90 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: agentbox
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 90 days
          validate: true
          dry-run: ${{ env.DRY_RUN }}
