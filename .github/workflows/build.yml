# Publishes ghcr.io/crowdprobe/agentbox:<target> (latest, moving) and
# :<target>-YYYYMMDD-HHmmss (UTC, unique and never overwritten: the job
# refuses to push if that tag already exists). Runs after every merge to main
# (i.e. after a Renovate automerge) and daily, so Debian security updates land
# without a PR.
#
# Built WITHOUT a shared cache and with a fresh base pull, so a publish never
# reuses layers another workflow could have written.
name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # Release tags come from main only. workflow_dispatch can be started on any
    # branch from the UI; on anything but main this job is skipped, not run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr
      id-token: write        # keyless cosign + provenance attestation
      attestations: write
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        target: [core, cad, ml, infra]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.target }} for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          pull: true
          no-cache: true
          load: true
          tags: agentbox:${{ matrix.target }}-test

      - name: Smoke test (publish only if this passes)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "agentbox:${TARGET}-test" \
            bash /src/scripts/smoke_test.sh "$TARGET"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }}
            type=raw,value=${{ matrix.target }}-{{date 'YYYYMMDD-HHmmss' tz='UTC'}}

      # Dated tags identify exactly one build. Builds of main are serialized
      # (concurrency group above) and each target is its own job, so a clash
      # should be impossible - this makes it a hard failure instead of a
      # silent overwrite if it ever happens.
      - name: Refuse to overwrite an existing dated tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          MOVING: ${{ env.IMAGE }}:${{ matrix.target }}
        run: |
          while read -r tag; do
            [[ -z "$tag" || "$tag" == "$MOVING" ]] && continue
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists - published tags are immutable"
              exit 1
            fi
            echo "$tag is new"
          done <<< "$TAGS"

      # Same builder, same inputs: reuses the layers just built and tested.
      - id: push
        name: Push ${{ matrix.target }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Report-only: blocking would freeze an older, equally vulnerable image.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

  notify:
    needs: publish
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close the build-failure issue (GitHub emails the assignee)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.publish.result }}
          ASSIGNEE: ${{ vars.FAILURE_ASSIGNEE }}
          WORKFLOW: build
        with:
          script: |
            const failed = ['failure', 'cancelled', 'timed_out'].includes(process.env.RESULT);
            const title = `${process.env.WORKFLOW} workflow failing`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'build-failure', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (failed) {
              const body = `Run ${runUrl} finished with \`${process.env.RESULT}\` (trigger: ${context.eventName}, ${context.sha.slice(0, 7)}).`;
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: ['build-failure'],
                  assignees: process.env.ASSIGNEE ? [process.env.ASSIGNEE] : [] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number,
                body: `Fixed: ${runUrl} succeeded.` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }
