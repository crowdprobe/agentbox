# Self-hosted Renovate, daily and after successful CI on Renovate branches.
# The daily run discovers updates ahead of the 05:37 build. Uses a GitHub App
# token: PRs and merges made with the default GITHUB_TOKEN would not trigger
# ci.yml / build.yml, and the automerge flow depends on both.
#
# Needs: repository variable RENOVATE_APP_CLIENT_ID and secret
# RENOVATE_APP_PRIVATE_KEY (the App installed on this repository only).
# Optional secret RENOVATE_PUBLIC_GITHUB_TOKEN: a dedicated user token with only
# public-repository read access, for upstream tag/release lookups whose IP
# allowlists reject installation tokens. Falls back to the App token if unset.
# The App itself must be granted every permission requested below (incl.
# Commit statuses: read and write), or the token step fails.
name: renovate

# The completion trigger only wakes trusted default-branch automation. It never
# checks out PR code or consumes artifacts from the triggering workflow.
on: # zizmor: ignore[dangerous-triggers]
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at :00
    # under load.
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: ["renovate/**"]

permissions: {}

jobs:
  renovate:
    # workflow_run executes the default-branch workflow; never check out the
    # triggering PR's code with these credentials. Exclude fork and failed CI.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    # Queue only eligible runs, so skipped CI events cannot replace pending work.
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Only what Renovate needs, whatever the App itself was granted.
          permission-contents: write        # branches + commits
          permission-pull-requests: write   # open/automerge PRs
          permission-issues: write          # dependency dashboard
          permission-workflows: write       # bump pinned Action SHAs
          permission-checks: read           # automerge gating
          permission-statuses: write        # renovate/stability-days status; a 403 here aborts the run before the PR is opened
          permission-vulnerability-alerts: read  # security-fix PRs from GitHub advisories

      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.103.6
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          # Aqua's IP allowlist rejects installation tokens for public lookups.
          # Scope the dedicated user token to metadata datasources, not PR writes.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"github-tags","matchHost":"api.github.com","token":"${{ secrets.RENOVATE_PUBLIC_GITHUB_TOKEN || steps.app-token.outputs.token }}"},
             {"hostType":"github-releases","matchHost":"api.github.com","token":"${{ secrets.RENOVATE_PUBLIC_GITHUB_TOKEN || steps.app-token.outputs.token }}"}]
          LOG_LEVEL: info

  notify:
    needs: renovate
    if: always() && needs.renovate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close the renovate-failure issue (GitHub emails the assignee)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.renovate.result }}
          ASSIGNEE: ${{ vars.FAILURE_ASSIGNEE }}
          WORKFLOW: renovate
        with:
          script: |
            const failed = ['failure', 'cancelled', 'timed_out'].includes(process.env.RESULT);
            const title = `${process.env.WORKFLOW} workflow failing`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'build-failure', per_page: 100 });
            const existing = open.find(i => i.title === title);
            if (failed) {
              const body = `Run ${runUrl} finished with \`${process.env.RESULT}\`.`;
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: ['build-failure'],
                  assignees: process.env.ASSIGNEE ? [process.env.ASSIGNEE] : [] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number,
                body: `Fixed: ${runUrl} succeeded.` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }
